[project]
name = "traveltimemaps"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.2.2",
    "pandas>=2.2.3",
    "pillow>=10.0.0",
    "plotly>=5.24.1",
    "python-dotenv>=1.0.0",
    "requests>=2.32.3",
    "scipy>=1.15.1",
    "shapely>=2.0.6",
    "streamlit>=1.41.1",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["traveltimemaps*"]
